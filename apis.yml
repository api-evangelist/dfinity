aid: dfinity
name: DFINITY
description: >-
  The DFINITY Foundation is a Swiss-based not-for-profit research organization that
  created and stewards the Internet Computer Protocol (ICP), a public, decentralized
  "frontier cloud" that hosts software and data entirely inside a mathematical network
  protocol. Applications run as canisters (WebAssembly smart contracts with persistent
  state, native HTTP, and a reverse gas model paid in Cycles) that are tamperproof,
  unstoppable, and free from vendor lock-in. ICP uses Chain Key cryptography and Chain
  Fusion to transact natively on Bitcoin and Ethereum without bridges, and is governed
  on-network by the Network Nervous System (NNS). DFINITY publishes first-party developer
  tooling — JavaScript/TypeScript agent libraries under the @dfinity npm scope, Rust
  agent and Canister Developer Kit crates, the icp/dfx CLIs, and an AI agent skills
  library — plus a public HTTP interface for reading from and calling canisters.
